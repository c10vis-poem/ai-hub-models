name: Qwen3-VL-4B-Instruct
id: qwen3_vl_4b_instruct
status: published
headline: Multimodal 4B vision-language model with enhanced visual reasoning capabilities.
domain: Generative AI
description: Qwen3-VL is a vision-language model from Alibaba Cloud capable of understanding both text and images for multimodal reasoning tasks such as visual question answering and image captioning.
use_case: Text Generation
tags:
- llm
- vlm
- generative-ai
research_paper: https://arxiv.org/abs/2505.09388
research_paper_title: Qwen3 Technical Report
license: https://www.apache.org/licenses/LICENSE-2.0
source_repo: https://huggingface.co/Qwen/Qwen3-VL-4B-Instruct
technical_details:
  Model architecture: Transformer with ViT Vision Encoder, Grouped Query Attention (GQA), and SwiGLU activation.
  Supported languages: 100+ languages and dialects
  TTFT: Time To First Token is the time it takes to generate the first response token. This is expressed as a range because it varies based on the length of the prompt.
  Response Rate: Rate of response generation after the first response token.
applicable_scenarios:
- Dialogue
- Content Generation
related_models:
- qwen3_vl_2b_instruct
- qwen2_5_vl_7b_instruct
form_factors:
- Phone
- Tablet
- IoT
