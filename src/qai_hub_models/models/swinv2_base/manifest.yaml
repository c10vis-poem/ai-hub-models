name: SwinV2-Base
id: swinv2_base
status: published
headline: Imagenet classifier and general purpose backbone.
domain: Computer Vision
description: SwinV2Base is a machine learning model that can classify images from
  the Imagenet dataset. It can also be used as a backbone in building more complex
  models for specific use cases.
use_case: Image Classification
tags:
- backbone
- bu-auto
applicable_scenarios:
- Medical Imaging
- Anomaly Detection
- Inventory Management
related_models:
- swin_tiny
- swin_small
- mobilenet_v2
- densenet121
- googlenet
form_factors:
- Phone
- Tablet
- IoT
- XR
- Auto
has_static_banner: true
has_animated_banner: true
dataset:
- imagenet-1k
- imagenet-22k
technical_details:
  Model checkpoint: Imagenet
  Input resolution: 256x256
  Number of parameters: 88.8M
  Model size (float): 339 MB
  Model size (w8a16): 90.2 MB
license_type: bsd-3-clause
research_paper: https://arxiv.org/abs/2111.09883
research_paper_title: 'Swin Transformer V2: Scaling Up Capacity and Resolution'
source_repo:
  https://github.com/pytorch/vision/blob/main/torchvision/models/swin_transformer.py
license: https://github.com/pytorch/vision/blob/main/LICENSE
supported_precisions:
- float
- w8a16
has_on_target_demo: true
disabled_paths:
