    onnx:
      scorecard_accuracy_failure: Torch and On-device accuracy diff (-17.400 %) above
        threshold (10.0 %)
  w8a16:
    onnx:
      scorecard_accuracy_failure: Torch and On-device accuracy diff (-19.100 %) above
