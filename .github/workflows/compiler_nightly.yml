name: Compiler Nightly Scorecard

on:
  # DISABLED: Scheduled runs have been commented out
  # schedule:
  #   - cron: '0 9 * * *'
  
  workflow_dispatch:
    inputs:
      aihm_tag:
        description: 'Git tag of AIHM (e.g., v0.48.0). If not provided, uses latest tag.'
        required: false
        type: string
      dry_run:
        description: 'Process only first 10 models for testing'
        required: false
        type: boolean
        default: false
      delay:
        description: 'Wait time before collecting results'
        required: true
        default: compiler_nightly_2h_delay
        type: choice
        options:
          - compiler_nightly_2h_delay
          - compiler_nightly_immediate
      always_upload:
        description: 'Always upload models from prod (skip checking for existing models in dev)'
        required: false
        type: boolean
        default: false
      hub_env:
        description: 'Target hub env/profile to compile against (e.g. dev, or a bespoke sandbox like myfeature.sandbox). Defaults to dev.'
        required: false
        type: string
        default: dev

jobs:
  disabled_notice:
    name: Workflow Disabled
    runs-on: ubuntu-latest
    steps:
      - run: echo "This workflow has been disabled by the repository owner"
